# Nginx reverse proxy in front of the Next.js app (api:3000).
# Certificates come from Let's Encrypt via the certbot service in compose.yml.
# First-time setup: run scripts/init-letsencrypt.sh once on the server.

# Only send "Connection: upgrade" when the client actually asked for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: serve Let's Encrypt challenges, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name relocato.in www.relocato.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://relocato.in$request_uri;
    }
}

# www -> apex over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.relocato.in;

    ssl_certificate     /etc/letsencrypt/live/relocato.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relocato.in/privkey.pem;

    return 301 https://relocato.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relocato.in;

    ssl_certificate     /etc/letsencrypt/live/relocato.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relocato.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Admin media uploads allow up to 4 MB (src/lib/media.ts); leave headroom.
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
