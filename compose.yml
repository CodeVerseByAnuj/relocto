services:
  postgres:
    image: postgres:18
    container_name: relocato-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    # Postgres 18+ stores data in a versioned subdir (PGDATA=/var/lib/postgresql/18/docker)
    # and refuses to start if a volume is mounted at /var/lib/postgresql/data.
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}

    container_name: relocato-api
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: